<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endless Arcade — Privacy Policy</title>
<meta name="description" content="Privacy policy for the Endless Arcade Android game: no ads, no tracking, optional Google Play Games leaderboards and achievements.">
<meta name="theme-color" content="#07061a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07061a; --bg2:#120a33; --ink:#eef0ff; --dim:#a9acd6;
    --cyan:#22d3ee; --pink:#ff3ea5; --gold:#ffc45c; --green:#7ed957; --violet:#a07bff;
    --card:rgba(20,18,58,.72); --line:rgba(160,123,255,.28);
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; color:var(--ink); background:var(--bg);
    font:17px/1.65 "Outfit",system-ui,sans-serif; overflow-x:hidden;
  }
  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:-2; }
  /* Synthwave floor grid at the bottom of the screen. */
  .grid {
    position:fixed; left:-50%; right:-50%; bottom:0; height:42vh; z-index:-1;
    background:
      linear-gradient(to top, rgba(255,62,165,.35) 2px, transparent 2px) 0 0/100% 48px,
      linear-gradient(to right, rgba(34,211,238,.28) 2px, transparent 2px) 0 0/64px 100%;
    transform:perspective(320px) rotateX(62deg); transform-origin:bottom;
    mask-image:linear-gradient(to top, #000 10%, transparent 90%);
    -webkit-mask-image:linear-gradient(to top, #000 10%, transparent 90%);
    animation:floor 2.4s linear infinite;
  }
  @keyframes floor { to { background-position:0 48px, 0 0; } }
  /* CRT scanlines over everything. */
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  }

  main { max-width:860px; margin:0 auto; padding:20px 16px 120px; }
  .pixel { font-family:"Press Start 2P",monospace; letter-spacing:.04em; }

  .bar { display:flex; justify-content:flex-end; gap:6px; flex-wrap:wrap; }
  .bar button {
    font:10px/1 "Press Start 2P",monospace; color:var(--dim); background:transparent;
    border:2px solid var(--line); padding:9px 10px; border-radius:4px; cursor:pointer;
  }
  .bar button[aria-pressed="true"] { color:var(--bg); background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 14px var(--cyan); }

  .hero { text-align:center; padding:56px 0 24px; }
  .coin {
    display:inline-block; font-size:11px; color:var(--gold); border:2px solid var(--gold);
    padding:8px 12px; border-radius:4px; animation:blink 1.1s steps(2,start) infinite;
  }
  @keyframes blink { to { visibility:hidden; } }
  h1 {
    margin:22px 0 6px; font-size:clamp(28px,8vw,64px); line-height:1.05;
    background:linear-gradient(180deg,#fff 0%,#ffd6f0 35%,var(--pink) 55%,var(--violet) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,62,165,.55)) drop-shadow(0 4px 0 #2a0b4f);
    font-weight:800; letter-spacing:.02em; text-transform:uppercase;
  }
  .sub { font-size:clamp(11px,2.6vw,15px); color:var(--cyan); text-shadow:0 0 12px var(--cyan); }
  .date { color:var(--dim); margin-top:18px; font-size:15px; }
  .lead { max-width:640px; margin:18px auto 0; font-size:18px; }

  /* Scoreboard of zeros. */
  .score { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:40px 0 8px; }
  .tile {
    background:var(--card); border:2px solid var(--line); border-radius:10px;
    padding:16px 8px 14px; text-align:center; backdrop-filter:blur(6px);
  }
  .tile b { display:block; font:28px/1 "Press Start 2P",monospace; color:var(--c); text-shadow:0 0 16px var(--c); }
  .tile span { display:block; margin-top:12px; font-size:14px; color:var(--dim); line-height:1.3; }
  @media (max-width:640px) { .score { grid-template-columns:repeat(2,1fr); } }

  /* Levels. */
  .level {
    position:relative; margin-top:22px; padding:22px 22px 18px 22px;
    background:var(--card); border:2px solid var(--line); border-radius:14px; backdrop-filter:blur(6px);
    opacity:0; transform:translateY(24px); transition:opacity .6s, transform .6s, border-color .3s, box-shadow .3s;
  }
  .level.on { opacity:1; transform:none; }
  .level:hover { border-color:var(--c); box-shadow:0 0 0 1px var(--c), 0 0 32px -8px var(--c); }
  .level::before {
    content:""; position:absolute; left:-2px; top:18px; bottom:18px; width:4px; border-radius:2px;
    background:var(--c); box-shadow:0 0 12px var(--c);
  }
  .lv { font-size:10px; color:var(--c); }
  .level h2 { margin:8px 0 10px; font-size:22px; line-height:1.25; }
  .level p, .level li { color:#d9dbf5; }
  .level ul { padding-left:0; list-style:none; margin:10px 0; }
  .level li { position:relative; padding-left:26px; margin:8px 0; }
  .level li::before {
    content:""; position:absolute; left:4px; top:.6em; width:10px; height:10px;
    background:var(--c); box-shadow:0 0 8px var(--c); transform:rotate(45deg);
  }
  .level a { color:var(--c); font-weight:600; }
  .boss { border-width:3px; }
  .badges { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 4px; }
  .badge {
    display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
    background:rgba(126,217,87,.12); border:1px solid rgba(126,217,87,.5); font-size:14px;
  }
  .badge svg { width:18px; height:18px; }

  footer { text-align:center; margin-top:56px; color:var(--dim); font-size:14px; }
  footer .pixel { display:block; font-size:11px; color:var(--pink); margin-bottom:10px; text-shadow:0 0 10px var(--pink); }

  @media (prefers-reduced-motion: reduce) {
    .grid, .coin { animation:none; }
    .level { transition:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <footer>

</main>

      var body = l[1].replace(/\{B:([^}]+)\}/g, '<span class="badge">' + tick + "$1</span>");
      return '<section class="level' + (last ? " boss" : "") + '" style="--c:var(' + colors[i] + ')">' +
        '<div class="lv pixel">' + (last ? t.boss : t.lv + " " + (i + 1)) + "</div><h2>" + l[0] + "</h2>" + body + "</section>";
    }).join("");
    levelsEl.querySelectorAll(".level").forEach(function (s) { io ? io.observe(s) : s.classList.add("on"); });
    document.querySelectorAll(".bar button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang); });
  }

  function pick() {
    var q = new URLSearchParams(location.search).get("lang");
    if (T[q]) return q;
    var nav = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < nav.length; i++) { var c = String(nav[i]).slice(0, 2).toLowerCase(); if (T[c]) return c; }
    return "en";
  }
  document.querySelectorAll(".bar button").forEach(function (b) {
    b.addEventListener("click", function () { render(b.dataset.lang); history.replaceState(null, "", "?lang=" + b.dataset.lang); });
  });
  render(pick());

  // Starfield: drifting pixel stars, still when the viewer asks for reduced motion.
  var cv = document.getElementById("stars"), cx = cv.getContext("2d"), stars = [], W, H;
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
    stars = [];
    for (var i = 0; i < 140; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 0.8 + 0.2, p: Math.random() * 6 });
  }
  function frame(ts) {
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#07061a"); g.addColorStop(0.6, "#140a3a"); g.addColorStop(1, "#2a0b4f");
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (!still) { s.y += s.z * 0.6; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
      var a = 0.5 + 0.5 * Math.sin(ts / 600 + s.p);
      cx.fillStyle = "rgba(255,255,255," + (s.z * a).toFixed(2) + ")";
      var r = s.z > 0.8 ? 3 : 2;
      cx.fillRect(s.x | 0, s.y | 0, r, r);
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", function () { size(); if (still) frame(0); });
  size(); still ? frame(0) : requestAnimationFrame(frame);
})();
</script>
